async function call(fn, args){

function demoCall(fn, a){
  switch (fn) {
    case "recurring_plans_list": return D.plans;
    case "recurring_plan_charges": return D.charges[a.p_id] || [];
    case "failed_charges_list": return D.failed.filter(x => !x.handled);
    case "payment_issues_list": return D.issues.filter(x => !x.handled);
    case "recurring_upcoming": return D.upcoming.filter(x => x.date <= a.p_until);
    case "recurring_charges_by_date": return D.byDate;
    case "pay_links_list": return D.links;
    case "billing_rules_get": return D.rules;
    case "billing_rules_save": Object.assign(D.rules, a.p); return D.rules;
    case "recurring_plan_set_status": { const p = D.plans.find(x => x.id === a.p_id); p.status = a.p_status; p.pending_update = true; return { ok: true }; }
    case "recurring_plan_set_next_date": { const p = D.plans.find(x => x.id === a.p_id); p.charge_day = Number(a.p_date.slice(8, 10)); p.pending_update = true; return { ok: true }; }
    case "recurring_plan_update": { const p = D.plans.find(x => x.id === a.p_id); Object.assign(p, a.p); p.pending_update = true; return { ok: true }; }
    case "charge_mark_handled": { [D.failed, D.issues].forEach(l => l.forEach(x => { if (x.id === a.p_id) x.handled = true; })); const p = D.plans.find(x => x.id === "p2"); if (a.p_id === 22) { p.status = "active"; p.open_missed = 0; } return { ok: true }; }
    case "missed_charge_link": { const f = D.failed.find(x => x.id === a.p_id); f.pay_link = "https://telem-tirgul.github.io/pay.html?c=demo-missed"; return { url: f.pay_link }; }
    case "pay_link_create": { const l = { code: "demo" + Date.now(), url: "https://telem-tirgul.github.io/pay.html?c=demo" + Date.now(), created_at: new Date().toISOString(), created_by_name: "נועה", parent_name: (a.p.fields && a.p.fields.parent_name && a.p.fields.parent_name.value) || "", student_name: "", description: a.p.description || "תשלום לתלם", one_time_amount: a.p.one_time_amount, monthly_amount: a.p.monthly ? a.p.monthly.amount : null, monthly_count: a.p.monthly ? a.p.monthly.count : null, status: "sent", fields: a.p.fields || {} }; D.links.unshift(l); return l; }
    case "pay_link_cancel": { const l = D.links.find(x => x.code === a.p_code); l.status = "cancelled"; return { ok: true }; }
    default: return null;
  }
}

  b.querySelectorAll("[data-done]").forEach(x => x.onclick = async () => {
    const note = prompt("מה נעשה? (למשל: חויב ידנית בריווחית / ההורה שילם בהעברה)", ""); if (note === null) return;
    try { await call("charge_mark_handled", { p_id: Number(x.dataset.done), p_note: note }); toast("סומן כטופל"); await refresh(); } catch(e) { toast("לא נשמר: " + e.message); }
  });
}

// ---------- 3. דורש טיפול ----------
function renderIssues(b){
  b.innerHTML = `<div class="note" style="margin-bottom:12px">תשלומים שהמערכת סימנה לבדיקה: תשלום כפול, סכום לא תואם, הוראת קבע שלא הוקמה. מטפלים בממשק של ריווחית (למשל זיכוי) ומסמנים "טופל".</div>` +
    (S.issues.length ? `<div class="rows-card">${S.issues.map(x => `<div class="card fc" style="border-inline-start-color:var(--warn)"><div><div class="who">${esc(x.issue || "")}</div>
        <div class="meta">${esc(x.description || "")} · ${money(x.amount)} · ${dmy(x.created_at)}${x.card_last4 ? " · " + card4(x.card_last4) : ""}${x.transaction_id ? ` · עסקה <span class="ltr">${esc(x.transaction_id)}</span>` : ""}</div>
        <div class="meta">${esc(x.parent_name || "")} ${x.parent_phone ? `· <a class="ltr" href="tel:${esc(x.parent_phone)}">${esc(x.parent_phone)}</a>` : ""}</div></div>
        <div class="acts"><button class="btn small primary" data-done="${x.id}" type="button">✓ טופל</button></div></div>`).join("")}</div>`
      : `<div class="card empty">✓ אין תשלומים שדורשים טיפול.</div>`);
  wireCommon(b);
}

// ---------- 4. חיובים לפי תאריך ----------
async function renderDates(b){
  const t = todayIL(), [up, past] = await Promise.all([call("recurring_upcoming", { p_until: addDays(t, 31) }), call("recurring_charges_by_date", { p_from: addDays(t, -92), p_to: t })]);
  const upBy = {}; (up || []).forEach(u => (upBy[u.date] = upBy[u.date] || []).push(u));
  b.innerHTML = `<h3 style="margin:0 0 8px">חיובים קרובים (חודש קדימה)</h3>
    ${Object.keys(upBy).length ? Object.keys(upBy).sort().map(d => `<details class="day"><summary><span>${dmy(d)}</span><span>${upBy[d].length} חיובים</span><span class="num">${money(upBy[d].reduce((s, u) => s + Number(u.amount), 0))}</span></summary>
      <table class="tbl" style="margin-top:8px"><tbody>${upBy[d].map(u => `<tr class="click" data-plan="${esc(u.plan_id)}"><td><b>${esc(u.student_name || "")}</b></td><td class="hide-m">${esc(u.parent_name || "")}</td><td class="num">${money(u.amount)}</td><td>${u.charge_no}/${u.total}</td><td class="hide-m">${card4(u.card_last4, u.card_exp)}</td></tr>`).join("")}</tbody></table></details>`).join("")
      : `<div class="card empty">אין חיובים בחודש הקרוב.</div>`}
    <h3 style="margin:18px 0 8px">חיובים שהיו (3 חודשים)</h3>
    ${(past || []).length ? (past || []).map(x => `<details class="day"><summary><span>${dmy(x.date)}</span><span style="color:var(--ok)">✓ ${x.ok_count} · ${money(x.ok_sum)}</span>${x.fail_count ? `<span style="color:var(--full)">✗ ${x.fail_count} לא התקבלו · ${money(x.fail_sum)}</span>` : ""}</summary>
      ${(x.rows || []).length ? `<table class="tbl" style="margin-top:8px"><tbody>${x.rows.map(r => `<tr class="click" data-plan="${esc(r.plan_id)}"><td><b>${esc(r.student_name || "")}</b></td><td class="num">${money(r.amount)}</td><td>${r.status === "אושר" ? `<span class="chip st-active">שולם</span>` : `<span class="chip st-failed">לא התקבל</span>`}${r.reason ? ` <span class="muted">${esc(r.reason)}</span>` : ""}${r.handled_note ? ` <span class="muted">· טופל: ${esc(r.handled_note)}</span>` : ""}</td><td>${r.document_url ? `<a href="${esc(r.document_url)}" target="_blank" rel="noopener">חשבונית</a>` : ""}</td></tr>`).join("")}</tbody></table>` : ""}</details>`).join("")
      : `<div class="card empty">עוד לא היו חיובים חודשיים.</div>`}`;
  b.querySelectorAll("[data-plan]").forEach(x => x.onclick = (e) => { if (e.target.closest("a")) return; openPlan(x.dataset.plan); });
}

// ---------- 5. ממתינים לתשלום ----------
async function loadPending(){
  if (DEMO) return D.pending;
  const [en, mr] = await Promise.all([
    get("enrollments", "select=id,created_at,first_charge_amount,monthly_amount,subject,city,student:students(first_name,last_name,family:families(parent1_first,parent1_last,parent1_phone))&status=eq." + encodeURIComponent("ממתין לתשלום") + "&order=created_at.desc").catch(() => []),
    get("marathon_registrations", "select=id,created_at,amount,student:students(first_name,last_name,family:families(parent1_first,parent1_last,parent1_phone)),marathon:marathons(name)&status=eq." + encodeURIComponent("ממתין לתשלום") + "&order=created_at.desc").catch(() => [])]);
  const nm = (s) => s ? [s.first_name, s.last_name].filter(Boolean).join(" ") : "", pf = (s) => (s && s.family) || {};
  return en.map(e => ({ kind: "registration", id: e.id, created_at: e.created_at, student_name: nm(e.student), parent_name: [pf(e.student).parent1_first, pf(e.student).parent1_last].filter(Boolean).join(" "), parent_phone: pf(e.student).parent1_phone, what: ["הרשמה", e.subject, e.city].filter(Boolean).join(" · "), amount: e.first_charge_amount, monthly: e.monthly_amount }))
    .concat(mr.map(r => ({ kind: "marathon", id: r.id, created_at: r.created_at, student_name: nm(r.student), parent_name: [pf(r.student).parent1_first, pf(r.student).parent1_last].filter(Boolean).join(" "), parent_phone: pf(r.student).parent1_phone, what: "מרתון" + (r.marathon ? " · " + r.marathon.name : ""), amount: r.amount })));
}
async function renderPending(b){
  const list = await loadPending();
  b.innerHTML = `<div class="note" style="margin-bottom:12px">הרשמות שנשלחו בלי תשלום (למשל "תשלום טלפוני"). שולחים להורה קישור תשלום - כשההורה משלם, ההרשמה עוברת ל"נרשם" לבד, ובהרשמה שבועית גם מוקמת הוראת הקבע.</div>` +
    (list.length ? `<table class="tbl"><thead><tr><th>תלמיד/ה</th><th class="hide-m">הורה</th><th>על מה</th><th>לתשלום</th><th class="hide-m">מתאריך</th><th></th></tr></thead><tbody>
      ${list.map((x, i) => `<tr><td><b>${esc(x.student_name)}</b></td><td class="hide-m">${esc(x.parent_name || "")}<div class="muted"><span dir="ltr">${esc(x.parent_phone || "")}</span></div></td><td>${esc(x.what)}</td>
        <td class="num">${money(x.amount)}${x.monthly ? `<div class="muted">ואז ${money(x.monthly)} בחודש</div>` : ""}</td><td class="hide-m">${dmy(x.created_at)}</td>
        <td><button class="btn small primary" data-pl="${i}" type="button">קישור תשלום</button></td></tr>`).join("")}</tbody></table>`
      : `<div class="card empty">✓ אין הרשמות שממתינות לתשלום.</div>`);
  b.querySelectorAll("[data-pl]").forEach(x => x.onclick = async () => {
    const it = list[Number(x.dataset.pl)]; x.disabled = true;
    try { const r = await call("pay_link_create", { p: { order: { kind: it.kind, id: it.id }, description: it.what } }); await copy(r.url);
      const wa = waLink(it.parent_phone, `שלום ${it.parent_name || ""}, לתשלום על ${it.what} של ${it.student_name} בתלם: ${r.url}`);
      x.outerHTML = wa ? `<a class="btn small" target="_blank" rel="noopener" href="${esc(wa)}">וואטסאפ להורה</a>` : `<span class="muted">הקישור הועתק</span>`; }
    catch(e) { toast("לא נוצר: " + e.message); x.disabled = false; }
  });
}

// ---------- 6. תשלום אישי ----------
const FIELDS = [["parent_name", "שם ההורה"], ["parent_email", "אימייל"], ["parent_phone", "טלפון"], ["student_first", "שם התלמיד/ה"], ["student_last", "שם משפחה"],
  ["city", "עיר"], ["school", "בית ספר"], ["grade", "שכבה"], ["class_num", "כיתה"], ["track", "מסלול"], ["subject", "מקצוע"]];
async function renderLinks(b){
  const list = await call("pay_links_list") || [];
  b.innerHTML = `<div class="page-head"><button class="btn primary" id="lNew" type="button">+ טופס תשלום חדש</button><span class="muted">קישור אישי להורה: תשלום חד-פעמי, ואם צריך - גם הוראת קבע. ההורה ממלא, חותם ומשלם באיקרדיט.</span></div>
    ${list.length ? `<table class="tbl"><thead><tr><th>נוצר</th><th>הורה / תלמיד/ה</th><th>על מה</th><th>סכום</th><th>סטטוס</th><th></th></tr></thead><tbody>
      ${list.map(l => { const ph = l.fields && l.fields.parent_phone && l.fields.parent_phone.value, wa = waLink(ph, `שלום, קישור לתשלום בתלם: ${l.url}`);
        return `<tr><td>${dmy(l.created_at)}<div class="muted">${esc(l.created_by_name || "")}</div></td><td>${esc(l.parent_name || "")}<div class="muted">${esc(l.student_name || "")}</div></td><td>${esc(l.description)}</td>
        <td class="num">${money(l.one_time_amount)}${l.monthly_amount ? `<div class="muted" dir="rtl">ועוד ${l.monthly_count} × ${money(l.monthly_amount)} בחודש</div>` : ""}</td>
        <td><span class="chip st-${esc(l.status)}">${esc(LINK_ST[l.status] || l.status)}</span></td>
        <td><div class="acts-row">${["sent", "opened"].includes(l.status) ? `<button class="btn small" data-copy="${esc(l.url)}" type="button">העתקה</button>${wa ? `<a class="btn small" target="_blank" rel="noopener" href="${esc(wa)}">וואטסאפ</a>` : ""}<button class="btn small danger" data-cancel="${esc(l.code)}" type="button">ביטול</button>` : ""}
          ${l.has_pdf ? `<button class="btn small" data-pdf="${esc(l.code)}" type="button">PDF חתום</button>` : ""}</div></td></tr>`; }).join("")}</tbody></table>`
      : `<div class="card empty">עוד אין טפסי תשלום אישיים.</div>`}`;
  wireCommon(b);
  $("lNew").onclick = newLink;
  b.querySelectorAll("[data-cancel]").forEach(x => x.onclick = async () => { if (!confirm("לבטל את הקישור? ההורה לא יוכל לשלם בו.")) return; try { await call("pay_link_cancel", { p_code: x.dataset.cancel }); toast("בוטל"); render(); } catch(e) { toast("לא בוטל: " + e.message); } });
  b.querySelectorAll("[data-pdf]").forEach(x => x.onclick = async () => { if (DEMO) { toast("בתצוגה לדוגמה אין PDF"); return; } try { const d = await call("pay_link_pdf", { p_code: x.dataset.pdf }); if (!d) return; const a = document.createElement("a"); a.href = String(d).startsWith("data:") ? d : "data:application/pdf;base64," + d; a.download = "טופס-תשלום.pdf"; a.click(); } catch(e) { toast("לא ניתן להוריד"); } });
}
function newLink(){
  pnlOpen(`<header><div><h2>טופס תשלום חדש</h2><div class="muted">נשלח להורה כקישור. מה שתמלאי כאן - נעול עבור ההורה.</div></div><button class="btn small x" type="button">✕</button></header>
    <div class="body"><div class="sec"><h3>מה משלמים</h3><div class="grid2">
      <div style="grid-column:1/-1"><label class="lbl" for="nDesc">תיאור (יופיע להורה ובחשבונית)</label><input type="text" id="nDesc" placeholder="למשל: שיעור פרטי - 3 מפגשים"></div>
      <div><label class="lbl" for="nOnce">תשלום עכשיו (₪)</label><input type="number" id="nOnce" min="1" max="20000"></div><div></div>
      <label class="chk" style="grid-column:1/-1"><input type="checkbox" id="nRec"> וגם הוראת קבע חודשית אחרי התשלום</label>
      <div class="nrec" hidden><label class="lbl" for="nMAmt">סכום חודשי (₪)</label><input type="number" id="nMAmt" min="1" max="5000"></div>
      <div class="nrec" hidden><label class="lbl" for="nMCnt">מספר חיובים חודשיים</label><input type="number" id="nMCnt" min="1" max="24"></div>
      <div class="nrec" hidden><label class="lbl" for="nMFirst">החיוב החודשי הראשון</label><input type="date" id="nMFirst"></div></div></div>
    <div class="sec"><h3>פרטים בטופס</h3><div class="muted" style="margin-bottom:8px">אפשר למלא מראש (ההורה לא יוכל לשנות), ולבחור מה חובה.</div>
      ${FIELDS.map(([k, t]) => `<div class="fld-row" style="margin-bottom:6px"><label class="lbl" for="nf_${k}" style="margin:0">${t}</label><input type="text" id="nf_${k}" ${k === "parent_phone" ? 'dir="ltr"' : ""}><label class="chk"><input type="checkbox" id="nr_${k}" ${k === "parent_name" || k === "parent_email" ? "checked" : ""}> חובה</label></div>`).join("")}</div>
    <div class="err" id="nErr"></div><div class="acts-row"><button class="btn primary" id="nSave" type="button">יצירת קישור</button><button class="btn" id="nCancel" type="button">ביטול</button></div></div>`);
  $("nRec").onchange = () => document.querySelectorAll(".nrec").forEach(x => x.hidden = !$("nRec").checked);
  $("nCancel").onclick = pnlClose;
  $("nSave").onclick = async () => {
    const once = Number($("nOnce").value), err = $("nErr"); err.textContent = "";
    if (!$("nDesc").value.trim()) { err.textContent = "חסר תיאור."; return; }
    if (!(once > 0)) { err.textContent = "חסר סכום לתשלום עכשיו."; return; }
    const p = { description: $("nDesc").value.trim(), one_time_amount: once, fields: {} };
    if ($("nRec").checked) { const a = Number($("nMAmt").value), c = Number($("nMCnt").value); if (!(a > 0) || !(c >= 1 && c <= 24)) { err.textContent = "בהוראת קבע: סכום חודשי ומספר חיובים (1-24)."; return; } p.monthly = { amount: a, count: c, first_date: $("nMFirst").value || "" }; }
    FIELDS.forEach(([k]) => { p.fields[k] = { value: $("nf_" + k).value.trim(), required: $("nr_" + k).checked }; });
    $("nSave").disabled = true;
    try { const r = await call("pay_link_create", { p }); pnlClose(); await copy(r.url); render(); } catch(e) { err.textContent = "לא נוצר: " + e.message; $("nSave").disabled = false; }
  };
}

// ---------- 7. חוקי חיוב ----------
async function renderRules(b){
  const r = await call("billing_rules_get") || {};
  b.innerHTML = `<div class="card" style="max-width:720px"><div class="grid2">
      <div><label class="lbl" for="rDay">יום החיוב החודשי (1-28)</label><input type="number" id="rDay" min="1" max="28" value="${esc(r.charge_day || 1)}"></div>
      <div><label class="lbl" for="rLast">החודש האחרון בשנה</label><select id="rLast">${[5, 6, 7].map(m => `<option value="${m}" ${Number(r.last_month) === m ? "selected" : ""}>${["", "", "", "", "", "מאי", "יוני", "יולי"][m]}</option>`).join("")}</select></div>
      <label class="chk" style="grid-column:1/-1"><input type="checkbox" id="rJune" ${r.june_offset ? "checked" : ""}> החיוב האחרון מקוזז (חומרי תרגול, ואם אין - דמי ההרשמה)</label>
      <div style="grid-column:1/-1"><label class="lbl" for="rMail">לאן נשלחות התראות (חיוב שלא התקבל)</label><input type="email" id="rMail" dir="ltr" value="${esc(r.alert_email || "")}"></div>
      <div style="grid-column:1/-1"><label class="lbl" for="rNote">הערות</label><textarea id="rNote" rows="3">${esc(r.note || "")}</textarea></div></div>
    <div class="note" style="margin:10px 0">הטקסט בטופס ההרשמה צריך להתאים לחוקים כאן. חיוב יחסי למי שמצטרף באמצע חודש (Pro Rata) - יתווסף כשתגדירי את הכלל.</div>
    <div class="acts-row"><button class="btn primary" id="rSave" type="button">שמירה</button><span class="muted">${r.updated_at ? "עודכן " + dmy(r.updated_at) : ""}</span></div></div>`;
  $("rSave").onclick = async () => {
    const d = Number($("rDay").value); if (!(d >= 1 && d <= 28)) { toast("יום 1-28"); return; }
    try { await call("billing_rules_save", { p: { charge_day: d, last_month: Number($("rLast").value), june_offset: $("rJune").checked, alert_email: $("rMail").value.trim(), note: $("rNote").value } }); toast("החוקים נשמרו"); render(); } catch(e) { toast("לא נשמר: " + e.message); }
  };
}

// ---------- התחלה ----------
(async () => {
  if (DEMO) $("demoBar").hidden = false;
  if (!DEMO) {
    if (!auth) { $("gate").hidden = false; $("gate").innerHTML = `צריך להיכנס למערכת קודם. <a href="index.html">למסך הכניסה ←</a> · <a href="?demo=1">תצוגה לדוגמה</a>`; return; }
    try { const me = await rpc("my_role"); if (!me || me.role !== "admin") { $("gate").hidden = false; $("gate").textContent = "המסך הזה למנהלים בלבד."; return; } $("who").textContent = me.full_name || ""; }
    catch(e) { $("gate").hidden = false; $("gate").innerHTML = `צריך להיכנס למערכת קודם. <a href="index.html">למסך הכניסה ←</a>`; return; }
  } else $("who").textContent = "תצוגה לדוגמה";
  $("app").hidden = false;
  await loadCounts(); paintTabs(); render();
})();
})();
