<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>דף תרגול - תלם</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{ --maroon:#5A1216; --gold:#C9A45C; --ink:#2B2320; --soft:#6B5F55; --border:#E5DDD3; --bg:#FAF8F5; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:Assistant, "Segoe UI", Arial, sans-serif; }
  .wrap{ max-width:760px; margin:0 auto; padding:16px 16px 28px; }
  .top{ text-align:center; } .top img{ height:64px; width:auto; }
  h1{ font-size:20px; color:var(--maroon); text-align:center; margin:6px 0 2px; }
  .sub{ text-align:center; color:var(--soft); font-size:14px; margin-bottom:12px; }
  .sheet{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:6px; }
  .sheet img{ width:100%; display:block; }
  .btns{ display:flex; gap:10px; justify-content:center; margin:14px 0 8px; }
  .b{ border:1.5px solid var(--maroon); background:var(--maroon); color:#fff; border-radius:999px; padding:10px 22px; font-weight:700; font-size:15px; text-decoration:none; cursor:pointer; font-family:inherit; }
  .b.o{ background:#fff; color:var(--maroon); }
  .foot{ text-align:center; font-size:12.5px; color:#8C8C8C; }
  .err{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px; text-align:center; color:var(--soft); line-height:1.7; }
  @media print{ .top, h1, .sub, .btns, .foot{ display:none; } .wrap{ padding:0; max-width:none; } .sheet{ border:0; padding:0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="logo.png" alt="תלם - המרכז לשיעורי תרגול"></div>
  <h1 id="t">דף תרגול</h1>
  <div class="sub" id="g"></div>
  <div class="sheet" id="sheet"><img id="img" alt="דף התרגול"></div>
  <div class="btns" id="btns"><a class="b" id="dl" download="דף תרגול.png">הורדה</a><button class="b o" type="button" id="pr">הדפסה</button></div>
  <div class="foot" id="foot">הדף נשלח מתלם - המרכז לשיעורי תרגול · לשאלות: 052-9067101</div>
</div>
<script>
(function(){
  var p = new URLSearchParams(location.hash.slice(1));
  var u = p.get("u") || "", t = p.get("t") || "דף תרגול", g = p.get("g") || "", e = p.get("e") || "";
  document.getElementById("t").textContent = t;
  document.title = t + " - תלם";
  document.getElementById("g").textContent = g;
  if (e) document.getElementById("foot").textContent += " · הקישור פתוח עד " + e;
  var ok = /^https:\/\/[a-z0-9-]+\.supabase\.co\/storage\/v1\/object\/sign\/worksheets\//.test(u);
  var img = document.getElementById("img");
  function fail(){
    document.getElementById("sheet").outerHTML = '<div class="err">הקישור לדף כבר לא פעיל.<br>אפשר לבקש מתלם שישלחו אותו שוב.</div>';
    document.getElementById("btns").style.display = "none";
  }
  if (!ok) { fail(); return; }
  img.onerror = fail;
  img.src = u;
  // הורדה: מורידים את התמונה עצמה כקובץ
  document.getElementById("dl").addEventListener("click", function(ev){
    ev.preventDefault();
    fetch(u).then(function(r){ return r.blob(); }).then(function(b){
      var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = t + ".png"; document.body.appendChild(a); a.click(); a.remove();
    }).catch(function(){ window.open(u, "_blank"); });
  });
  document.getElementById("pr").addEventListener("click", function(){ window.print(); });
})();
</script>
</body>
</html>
